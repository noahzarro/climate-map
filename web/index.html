  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --sidebar-width: 320px;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* never show a scrollbar, e.g. from a tooltip
                            positioned near the window edge */
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: var(--sidebar-width);
    }

    #sidebar {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      width: var(--sidebar-width);
      box-sizing: border-box;
      background: #fff;
      border-left: 1px solid #ddd;
      box-shadow: -2px 0 8px rgba(0, 0, 0, 0.08);
      overflow-y: auto;
      padding: 16px;
      z-index: 1;
    }

    #sidebar-toggle {
      display: none; /* only shown below the mobile breakpoint */
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 3;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid #ddd;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      color: #333;
    }

    #sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    #sidebar h1 {
      font-size: 16px;
      margin: 0 0 4px;
    }

    #sidebar h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #666;
      margin: 20px 0 8px;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }

    #selected-period-label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #222;
    }

    #variable-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .variable-button {
      border: 1px solid #ccc;
      background: #f7f7f7;
      border-radius: 6px;
      padding: 8px 6px;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .variable-button:hover {
      background: #eef2ff;
    }

    .variable-button.active {
      background: #4361ee;
      border-color: #4361ee;
      color: #fff;
      font-weight: 600;
    }

    #legend-gradient {
      width: 100%;
      height: 14px;
      border-radius: 3px;
      display: block;
      image-rendering: pixelated;
    }

    #legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #444;
      margin-top: 4px;
    }

    #calendar {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .month-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .month-label {
      font-size: 11px;
      font-weight: 600;
      color: #555;
    }

    .month-periods {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .period-cell {
      height: 24px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #f2f2f2;
      font-size: 10px;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .period-cell:hover {
      background: #dce4ff;
      border-color: #a9bbff;
    }

    .period-cell.selected {
      background: #4361ee;
      border-color: #4361ee;
      color: #fff;
      font-weight: 700;
    }

    #highlight-enable-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    #highlight-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #highlight-controls.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    #highlight-direction {
      display: flex;
      gap: 6px;
    }

    .direction-button {
      flex: 1;
      border: 1px solid #ccc;
      background: #f7f7f7;
      border-radius: 6px;
      padding: 6px 4px;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }

    .direction-button.active {
      background: #4361ee;
      border-color: #4361ee;
      color: #fff;
      font-weight: 600;
    }

    #highlight-value-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #444;
    }

    #highlight-threshold {
      width: 100%;
    }

    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 2;
      display: none;
      white-space: nowrap;
    }

    #loading {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      z-index: 1;
      display: none;
    }

    /* Small/mobile devices: the sidebar becomes a slide-in overlay (rather
       than permanently squeezing the map), hidden by default and toggled
       via the floating button + dimmed backdrop. */
    @media (max-width: 700px) {
      #map {
        right: 0;
      }

      #sidebar {
        width: min(var(--sidebar-width), 85vw);
        transform: translateX(100%);
        transition: transform 0.25s ease;
        z-index: 2;
      }

      #sidebar.open {
        transform: translateX(0);
      }

      #sidebar-toggle {
        display: flex;
      }

      #sidebar-backdrop.visible {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <button id="sidebar-toggle" type="button" aria-label="Toggle sidebar" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
  <div id="sidebar-backdrop"></div>

  <div id="sidebar">
    <h1>Climatology</h1>
    <div style="font-size: 12px; color: #777;">E-OBS 2011&ndash;2025, 48-period cycle</div>

    <h2>Variable</h2>
    <div id="variable-buttons"></div>

    <h2>Legend</h2>
    <img id="legend-gradient" src="" alt="legend" />
    <div id="legend-labels">
      <span id="legend-min"></span>
      <span id="legend-max"></span>
    </div>

    <h2>Highlight</h2>
    <div id="highlight-enable-row">
      <input type="checkbox" id="highlight-enable" />
      <label for="highlight-enable">Highlight areas matching a threshold</label>
    </div>
    <div id="highlight-controls" class="disabled">
      <div id="highlight-direction">
        <button type="button" class="direction-button active" data-direction="atLeast">At least (&ge;)</button>
        <button type="button" class="direction-button" data-direction="atMost">At most (&le;)</button>
      </div>
      <input type="range" id="highlight-threshold" step="0.1" />
      <div id="highlight-value-row">
        <span id="highlight-value-label">Threshold: -</span>
      </div>
    </div>

    <h2>Period</h2>
    <div id="selected-period-label">Loading...</div>
    <div id="calendar"></div>

  </div>

  <div id="tooltip"></div>
  <div id="loading">Loading period data...</div>

  <script src="app.js"></script>
</body>
</html>
